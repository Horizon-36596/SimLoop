name: Run JUnit Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests with Gradle
      run: ./gradlew test

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          **/build/test-results/**/*.xml

  # The documentation site, built on every push for one reason: so it can never become something that
  # only builds on one laptop. It is not published from here - see docs-publish.yml, which publishes it
  # on a release tag.
  #
  # This job fails on a broken internal link (mkdocs --strict), on a public symbol with no javadoc
  # (apiDocs runs -Werror), and on the site's version drifting from the build's. All three are defects a
  # reader finds and an author does not.
  #
  # The setup steps below (checkout, JDK, Python, pip, chmod, the one gradle command) are deliberately
  # identical to the `build` job in docs-publish.yml. There is no shared composite action because one
  # would be a third file to understand for six lines of setup; the cost is that a change here has to be
  # made there too. This job runs on every push, so if the two ever disagree, this one is the right one.
  #
  # The `SimLoop/` and `:SimLoop:` prefixes below are correct and are meant to stay. The library is a
  # Gradle subproject of a repository that contains only it, which reads as redundant and is not: the
  # reasons are in settings.gradle, and the short version is that it keeps the published coordinate and
  # the Android Gradle Plugin layout identical to what consumers already depend on.
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install the site's build dependencies
      run: pip install -r SimLoop/docs-requirements.txt

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build the documentation site
      run: ./gradlew :SimLoop:docsSite

    # Kept so a human can download and read exactly what CI built on a push, without waiting for a
    # release tag and a deployment. docs-publish.yml is what actually serves it.
    - name: Upload the built site
      uses: actions/upload-artifact@v4
      with:
        name: documentation-site
        path: SimLoop/build/docs/site
        if-no-files-found: error
