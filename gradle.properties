# AndroidX package structure. Required by the FIRST Tech Challenge SDK this library compiles against.
android.useAndroidX=true

# Not needed: nothing here depends on a pre-AndroidX library, and leaving it on slows every build.
android.enableJetifier=false

org.gradle.jvmargs=-Xmx1024M

android.nonTransitiveRClass=false

# Kept on deliberately. Without it this build re-runs configuration on every invocation, and the
# documentation tasks in SimLoop/build.gradle are slow enough to configure that it is noticeable.
org.gradle.configuration-cache=true
